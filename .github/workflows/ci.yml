name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      # Temporary preparation run: capture the generated lock, then commit it and remove this step.
      # A run that rewrites the lock is not treated as final-head validation.
      - name: Prepare minimatch compatibility lockfile
        run: |
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          node --input-type=commonjs - <<'NODE'
          const fs = require('node:fs');
          const data = fs.readFileSync('package-lock.json').toString('base64');
          console.log('MINIMATCH_LOCK_BEGIN');
          console.log(data.match(/.{1,120}/g).join('\n'));
          console.log('MINIMATCH_LOCK_END');
          NODE

      - name: Install dependencies
        run: npm ci

      # WebKit needs system libraries Chromium does not, which is what `--with-deps` installs.
      # The mobile project is Chromium-backed and needs nothing extra.
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium webkit

      # One step on purpose. `npm run validate` is the same gate contributors and agents run
      # locally, so the gate has one definition rather than a local list and a CI list. The two
      # documented copies of the chain, and this step's use of the script, are all checked by
      # `npm run check:agent-docs`, which the chain itself runs.
      #
      # Two costs come with collapsing the steps, both accepted: the Actions UI names the failing
      # step only as "Validate", so the failing command has to be read from the log, where each
      # `npm run` prints its own banner; and the browser install above now runs before the fast
      # checks, so a job that fails on lint still paid for it.
      - name: Validate
        id: gate
        run: npm run validate

      # Preserve the failed gate while collecting repair evidence if audit stops it early.
      # These checks use the already installed dependencies; they do not waive the audit.
      - name: Vendored braces regression diagnostics
        if: failure() && steps.gate.outcome == 'failure'
        run: |
          npm run check:vendored-braces
          node node_modules/vitest/vitest.mjs run scripts/check-vendored-braces.test.mjs scripts/minimatch-compat.test.mjs

      - name: Repair lint diagnostics
        if: failure() && steps.gate.outcome == 'failure'
        run: node node_modules/eslint/bin/eslint.js scripts/check-vendored-braces*.mjs scripts/minimatch-compat* vendor/minimatch-compat

      - name: Repair formatting diagnostics
        if: failure() && steps.gate.outcome == 'failure'
        run: |
          node node_modules/prettier/bin/prettier.cjs --check \
            package.json package-lock.json scripts/check-vendored-braces*.mjs \
            scripts/minimatch-compat* vendor/minimatch-compat .github/workflows/ci.yml

      - name: Gate documentation diagnostics
        if: failure() && steps.gate.outcome == 'failure'
        run: npm run check:agent-docs
